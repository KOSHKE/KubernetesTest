syntax = "proto3";

package events.inventory;

option go_package = "proto-go/events";

message StockReserved {
  string order_id = 1;
  string occurred_at = 2; // RFC3339
  string user_id = 3;
  int64 total_amount = 4; // minor units (e.g., cents)
  string currency = 5; // ISO 4217 currency code
  string payment_method = 6; // payment method (e.g., "CREDIT_CARD", "DEBIT_CARD")
  PaymentDetails payment_details = 7; // payment card details
}

message PaymentDetails {
  string card_number = 1;
  string card_holder = 2;
  string expiry_month = 3;
  string expiry_year = 4;
  string cvv = 5;
}


message StockReleased {
  string order_id = 1;
  string occurred_at = 2; // RFC3339
  string user_id = 3;
  string reason = 4; // optional reason for release
}

message StockCommitted {
  string order_id = 1;
  string occurred_at = 2; // RFC3339
  string user_id = 3;
  int64 total_amount = 4; // minor units (e.g., cents)
  string currency = 5; // ISO 4217 currency code
}


