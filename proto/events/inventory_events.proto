syntax = "proto3";

package events.inventory;

option go_package = "ecommerce-platform/proto-go/events";

import "common/common.proto";
import "google/protobuf/timestamp.proto";

message StockReserved {
  string order_id = 1;
  google.protobuf.Timestamp occurred_at = 2; // Use proper timestamp
  string user_id = 3;
  int64 total_amount = 4; // minor units (e.g., cents)
  string currency = 5; // ISO 4217 currency code
  string payment_method = 6; // payment method (e.g., "CREDIT_CARD", "DEBIT_CARD")
  common.PaymentDetails payment_details = 7; // payment card details
}


message StockReleased {
  string order_id = 1;
  google.protobuf.Timestamp occurred_at = 2; // Use proper timestamp
  string user_id = 3;
  string reason = 4; // optional reason for release
}

message StockCommitted {
  string order_id = 1;
  google.protobuf.Timestamp occurred_at = 2; // Use proper timestamp
  string user_id = 3;
  int64 total_amount = 4; // minor units (e.g., cents)
  string currency = 5; // ISO 4217 currency code
}


