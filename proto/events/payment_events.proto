syntax = "proto3";

package events.payment;

option go_package = "ecommerce-platform/proto-go/events";

import "common/common.proto";

message PaymentProcessed {
  string order_id = 1;
  string payment_id = 2;
  bool success = 3;
  string message = 4;
  int64 amount = 5;     // minor units
  string currency = 6;  // ISO 4217
  string occurred_at = 7; // RFC3339
  repeated common.OrderItem items = 8; // items that were reserved
}


