syntax = "proto3";

package events.order;

option go_package = "ecommerce-platform/proto-go/events";

import "common/common.proto";

message OrderCreated {
  string order_id = 1;
  string user_id = 2;
  repeated common.OrderItem items = 3;
  int64 total_amount = 4; // minor units
  string currency = 5;    // ISO 4217
  string occurred_at = 6; // RFC3339
  string payment_method = 7; // payment method (e.g., "CREDIT_CARD", "DEBIT_CARD")
}


