syntax = "proto3";

package common;

option go_package = "ecommerce-platform/proto-go/common";

import "google/protobuf/timestamp.proto";

// Value object for money in minor units
message Money {
  int64 amount = 1;    // minor units (e.g., cents)
  string currency = 2; // ISO 4217 (e.g., "USD")
}

// Common order item structure - used by both events and gRPC API
message OrderItem {
  string id = 1;           // Order item ID (optional, for gRPC API)
  string product_id = 2;   // Product ID (required)
  string product_name = 3; // Product name (optional, for gRPC API)
  int32 quantity = 4;      // Quantity (required)
  Money price = 5;         // Unit price (optional, for gRPC API)
  Money total = 6;         // Total price (optional, for gRPC API)
}

// Payment details for card payments
message PaymentDetails {
  string card_number = 1;
  string card_holder = 2;
  string expiry_month = 3;
  string expiry_year = 4;
  string cvv = 5;
}
